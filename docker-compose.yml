services:
  api:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://incubrix:local-dev-only@postgres:5432/incubrix}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-incubrix-local}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-local-minio-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-incubrix-artifacts}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SIMULATION_MODE: ${SIMULATION_MODE:-true}
      DEFAULT_RATE_LIMIT_REQUESTS: ${DEFAULT_RATE_LIMIT_REQUESTS:-60}
      DEFAULT_RATE_LIMIT_WINDOW_SECONDS: ${DEFAULT_RATE_LIMIT_WINDOW_SECONDS:-60}
      APP_CONFIG_FILE: ${APP_CONFIG_FILE:-}
      CALLBACK_HMAC_SECRET: ${CALLBACK_HMAC_SECRET:-replace-for-local-use}
      ECHO_SLEEP_SECONDS: ${ECHO_SLEEP_SECONDS:-3}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-incubrix}
      POSTGRES_USER: ${POSTGRES_USER:-incubrix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-incubrix} -d ${POSTGRES_DB:-incubrix}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-incubrix-local}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-local-minio-secret}
      MC_HOST_local: http://${MINIO_ACCESS_KEY:-incubrix-local}:${MINIO_SECRET_KEY:-local-minio-secret}@localhost:9000
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:

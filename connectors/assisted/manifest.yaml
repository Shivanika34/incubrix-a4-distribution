key: assisted
version: 1.0.0
tier: assisted
auth: none
surfaces:
  - key: manual_post
    content_types: [text, image, video_link]
    spec:
      title_max_chars: 200
      body_max_chars: 20000
      links_allowed: true
rate_limits:
  per_connection:
    requests: 0
    per_seconds: 0
capabilities: [assist]
error_map: {}
instance_param: submit_url
